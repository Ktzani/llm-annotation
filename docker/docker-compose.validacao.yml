# =============================================================
# docker/docker-compose.validacao.yml — interface web da validação humana
#
# Subir:   docker compose -f docker/docker-compose.validacao.yml up -d --build
# Logs:    docker compose -f docker/docker-compose.validacao.yml logs -f
#
# Configuração em ../.env (ver .env-example): HV_ADMIN_CODE, HV_EVALUATOR_1_CODE..3,
# HV_EXPERIMENT_BOOKS, HV_EXPERIMENT_DBLP e HV_RESULTS_DIR=/app/data/results.
# O SQLite (validacao_humana.db) e os resultados ficam em ../data (volume persistente).
# =============================================================
name: validacao-humana

services:
  validacao-humana:
    build:
      context: ..
      dockerfile: docker/Dockerfile.validacao
    image: validacao-humana:latest
    ports:
      - "${HV_PORT:-8001}:8001"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    restart: unless-stopped
