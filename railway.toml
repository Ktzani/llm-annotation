# Deploy da interface web da validação humana no Railway (ver docs/VALIDACAO_HUMANA_INTERFACE.md)
[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile.validacao"

[deploy]
# Uma única instância: SQLite e o fechamento automático assumem um só servidor
numReplicas = 1
healthcheckPath = "/api/saude"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
